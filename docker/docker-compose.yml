# Optional; NOT tested. Needs NVIDIA Container Toolkit. Mounts: adapters/ (LoRA), artifacts/reference_bundle, HF cache.
services:
  vllm:
    image: vllm/vllm-openai:v0.19.1
    platform: linux/amd64
    restart: unless-stopped
    command: >
      Qwen/Qwen3.5-4B --revision 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a --served-model-name base
      --dtype bfloat16 --gpu-memory-utilization 0.3 --max-model-len 16384 --max-num-seqs 32
      --max-num-batched-tokens 16384 --enable-prefix-caching
      --limit-mm-per-prompt '{"image": 2, "video": 0}' --mm-processor-kwargs '{"max_pixels": 1003520}'
      --enable-lora --lora-modules sft=/adapters/verifier --max-lora-rank 16
    volumes: ["../adapters:/adapters:ro", "${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
  api:
    image: sv200466/wine-scanner-api:latest
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports: ["127.0.0.1:8080:8080"]
    environment: {WS_VLLM_URL: "http://vllm:8000"}
    volumes: ["../artifacts/reference_bundle:/data/reference_bundle:ro", "${HF_CACHE:-~/.cache/huggingface}:/hf"]
    depends_on: [vllm]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    restart: unless-stopped
  frontend:
    image: sv200466/wine-scanner-frontend:latest
    platform: linux/amd64
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NUXT_API_INTERNAL_URL: http://api:8080
    ports: ["3000:3000"]
    environment:
      NUXT_PUBLIC_RECOGNITION_MODE: api
      NUXT_PUBLIC_API_BASE: ""
      NUXT_API_INTERNAL_URL: http://api:8080
    depends_on: [api]
    restart: unless-stopped
